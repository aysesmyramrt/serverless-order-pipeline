version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  order-ingestion:
    lang: python3-http
    handler: ./functions/order-ingestion
    image: ttl.sh/chaos-order-ingestion-demo17:24h
    environment:
      CHAOS_LATENCY_MS: "0"
      CHAOS_ERROR_RATE: "0.0"
      CHAOS_DOWNSTREAM_FAIL: "false"
      OPENFAAS_URL: "http://gateway.openfaas.svc.cluster.local:8080"

  payment-processing:
    lang: python3-http
    handler: ./functions/payment-processing
    image: ttl.sh/chaos-payment-processing-demo17:24h
    environment:
      CHAOS_LATENCY_MS: "0"
      CHAOS_ERROR_RATE: "0.0"
      CHAOS_DOWNSTREAM_FAIL: "false"
      OPENFAAS_URL: "http://gateway.openfaas.svc.cluster.local:8080"

  inventory-management:
    lang: python3-http
    handler: ./functions/inventory-management
    image: ttl.sh/chaos-inventory-management-demo17:24h
    environment:
      CHAOS_LATENCY_MS: "0"
      CHAOS_ERROR_RATE: "0.0"
      CHAOS_DOWNSTREAM_FAIL: "false"
      OPENFAAS_URL: "http://gateway.openfaas.svc.cluster.local:8080"

  shipping-dispatch:
    lang: python3-http
    handler: ./functions/shipping-dispatch
    image: ttl.sh/chaos-shipping-dispatch-demo17:24h
    environment:
      CHAOS_LATENCY_MS: "0"
      CHAOS_ERROR_RATE: "0.0"
      CHAOS_DOWNSTREAM_FAIL: "false"
