---
# order-ingestion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-ingestion
  namespace: openfaas-fn
  labels:
    faas_function: order-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      faas_function: order-ingestion
  template:
    metadata:
      labels:
        faas_function: order-ingestion
    spec:
      containers:
      - name: order-ingestion
        image: localhost:5001/order-ingestion:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: CHAOS_LATENCY_MS
          value: "0"
        - name: CHAOS_ERROR_RATE
          value: "0.0"
        - name: CHAOS_DOWNSTREAM_FAIL
          value: "false"
        - name: OPENFAAS_URL
          value: "http://gateway.openfaas.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: order-ingestion
  namespace: openfaas-fn
  labels:
    faas_function: order-ingestion
spec:
  selector:
    faas_function: order-ingestion
  ports:
  - port: 8080
    targetPort: 8080
